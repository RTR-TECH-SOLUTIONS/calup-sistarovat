name: Build pentru grundstuecke-banat-rumaenien.com

# Site-ul de pe domeniul clientului, găzduit la noi (Enhance). Spre deosebire de demo:
# adresele pornesc din rădăcina domeniului și nu există robots.txt care să blocheze
# indexarea. Se pornește de mână; rezultatul (dist/) rămâne ca artefact „site”, gata
# de urcat în public_html.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dependențe
        run: npm ci

      - name: Build Astro
        run: npm run build
        env:
          SITE_URL: https://grundstuecke-banat-rumaenien.com
          SITE_BASE: /
          PUBLIC_MAPBOX_TOKEN: ${{ secrets.PUBLIC_MAPBOX_TOKEN }}

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 14
